name: Optional paid quality evaluation
"on":
  workflow_dispatch:
    inputs:
      authorize_paid_calls:
        description: Authorize paid judge calls using the configured evaluation provider
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: online-quality-evaluation
  cancel-in-progress: false
jobs:
  quality:
    if: inputs.authorize_paid_calls
    environment: online-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOC_AGENT_ENV_FILE: /dev/null
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      RAGAS_EVAL_API_KEY: ${{ secrets.RAGAS_EVAL_API_KEY }}
      RAGAS_EVAL_MODEL: ${{ vars.RAGAS_EVAL_MODEL }}
      RAGAS_EVAL_BASE_URL: ${{ vars.RAGAS_EVAL_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require an explicit evaluation provider configuration
        run: |
          test -n "$RAGAS_EVAL_API_KEY"
          test -n "$RAGAS_EVAL_MODEL"
          test -n "$RAGAS_EVAL_BASE_URL"
      - run: python -m pip install -r backend/requirements-eval.txt
      - name: Evaluate frozen real snapshots only
        working-directory: backend
        run: python -m evals.runner --kind quality --quality-evaluator ragas --quality-source real_conversation_snapshot --quality-scope answer_quality --results-dir ../.check-results/quality
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: optional-quality-evaluation
          path: .check-results/quality
          if-no-files-found: ignore
          retention-days: 7
