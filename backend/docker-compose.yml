version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: noc-agent-db
    environment:
      POSTGRES_DB: noc_agent
      POSTGRES_USER: noc
      POSTGRES_PASSWORD: noc_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: noc-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    depends_on:
      - db
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

volumes:
  pg_data:
